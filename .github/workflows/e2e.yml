name: E2E

# Browser smoke tests: real Postgres, real backend, real frontend, real Chrome (Playwright).
# The AI model is never called (the tests do not add entries), so no API key is needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parsimony
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: parsimony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parsimony"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://parsimony:ci-only-password@localhost:5432/parsimony
      SECRET_KEY: ci-only-not-a-secret
      UPLOAD_DIR: /tmp/uploads
      RATE_LIMIT_SCALE: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the backend
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break || sleep 1; done
      - name: Install the frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: frontend
        run: npm run e2e
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/backend.log
