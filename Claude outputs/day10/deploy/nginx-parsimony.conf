# Server-level Nginx site for Parsimony. Copy to /etc/nginx/sites-available/parsimony
# (certbot will add the HTTPS part). It only answers for parsimony.duckdns.org.
server {
    listen 80;
    listen [::]:80;
    server_name parsimony.duckdns.org;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        # Overwrite (not append) so a visitor cannot fake their IP for the rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
