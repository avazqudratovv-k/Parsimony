# Runs inside the "web" container: serves the built app and forwards /api to the backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # The host Nginx already put the real visitor IP here; pass it on unchanged.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths go to index.html (the router decides).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
